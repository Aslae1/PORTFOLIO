<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f5ecd6;
    --bg-edge: #e9d8b3;
    --muted: #8b7a58;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #ece0c3; --bg-edge: #d9c79d; --muted: #7d6d4c; }
  }
  :root[data-theme="dark"] { --bg: #ece0c3; --bg-edge: #d9c79d; --muted: #7d6d4c; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(ellipse at 50% 42%, var(--bg) 0%, var(--bg) 45%, var(--bg-edge) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--muted);
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .16  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.22'/></svg>");
  }
  .stage {
    width: min(96vw, 1200px, calc((100vh - 70px) * 1.41));
    position: relative;
    filter: drop-shadow(0 18px 20px rgba(96, 62, 18, .14));
  }
  .stage svg { display: block; width: 100%; height: auto; overflow: visible; }
  .hint {
    margin: 0;
    padding: 0 16px;
    font-size: 15px;
    font-style: italic;
    letter-spacing: .01em;
    text-align: center;
    position: relative;
  }
</style>
</head>

  var f2 = function (n) { return n.toFixed(2); };

  function makeEye(el, m) {
    var q = function (c) { return el.querySelector('.' + c); };
    return {
      host: el, m: m,
      tx: 0, ty: 0, x: 0, y: 0, vx: 0, vy: 0, ps: 1,
      iris: q('iris'), hi: q('hi'), hiIn: q('hiIn'), pupil: q('pupil'), core: q('core'),
      brow: q('brow'), blink: q('blink'), closed: q('closedLid'), anchor: q('anchor'),
      wink: -1, winkAmt: 0, cx: 0, cy: 0
    };
  }

  function makeChar(id, cfg) {
    var root = document.querySelector('#' + id + ' .char');
    var q = function (c) { return root.querySelector('.' + c); };
    return {
      cfg: cfg,
      head: q('head'), hairBack: q('hairBack'), body: q('body'), ahoge: q('ahoge'),
      blush: q('blush'), mouthA: q('mouthA'), mouthB: q('mouthB'), face: q('faceAnchor'),
      eyes: [makeEye(root.querySelector('.eyeL'), -1), makeEye(root.querySelector('.eyeR'), 1)],
      hx: 0, hy: 0, rot: 0, bx: 0, by: 0, brot: 0,
      contact: 0, pulse: 0,
      blinkStart: -1, nextBlink: 1200 + r() * 2600, dbl: false,
      phase: r() * 6.28,
      awayTx: 0, awayTy: 0
    };
  }

  var chars = [
    // Mika: blushes easily, glances down when shy
    makeChar('mika', { b0: .35, b1: 1.0, smile: 1, ahoge: '0 -246', shy: true }),
    // Ren: calm, blushes a little when caught looking
    makeChar('ren', { b0: .12, b1: .8, smile: .9, ahoge: '42 -252', shy: false })
  ];

  function center(el) {
    var b = el.getBoundingClientRect();
    return [b.left + b.width / 2, b.top + b.height / 2];
  }

  function look(e, px, py, sat) {
    var dx = px - e.cx, dy = py - e.cy, d = Math.hypot(dx, dy);
    if (d < 1) { e.tx = 0; e.ty = 0; return; }
    var f = 1 - Math.exp(-d / sat);
    e.tx = dx / d * f;
    e.ty = dy / d * f;
  }

  /* ---------- input ---------- */
  var px = 0, py = 0, havePointer = false, lastMove = -1e9, pressUntil = 0;

  window.addEventListener('pointermove', function (ev) {
    px = ev.clientX; py = ev.clientY; havePointer = true;
    lastMove = performance.now();
  }, { passive: true });

  window.addEventListener('pointerdown', function (ev) {
    px = ev.clientX; py = ev.clientY; havePointer = true;
    lastMove = performance.now();
    pressUntil = lastMove + 260;
    var host = ev.target && ev.target.closest ? ev.target.closest('.eye') : null;
    var hit = null, hitChar = null;
    chars.forEach(function (c) {
      c.eyes.forEach(function (e) { if (host && e.host === host) { hit = e; hitChar = c; } });
    });
    if (hit) {
      if (hit.wink < 0) hit.wink = lastMove;
      hitChar.pulse = 1;
    } else {
      chars.forEach(function (c) { if (c.blinkStart < 0) c.blinkStart = lastMove; });
    }
  }, { passive: true });

  document.addEventListener('pointerout', function (ev) {
    if (!ev.relatedTarget) lastMove = performance.now() - 2600;
  });

  /* ---------- idle: they look at each other, then look away ---------- */
  var mode = 'away', modeUntil = 0;

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(.033, (now - last) / 1000);
    last = now;
    var rc = stage.getBoundingClientRect();
    var sat = Math.max(60, rc.width * .12);
    var pointerActive = havePointer && (now - lastMove < 3600);

    if (!pointerActive && now > modeUntil) {
      if (mode === 'contact') {
        mode = 'away';
        modeUntil = now + 1300 + r() * 1500;
        chars.forEach(function (c) {
          if (c.cfg.shy) { c.awayTx = (r() * 2 - 1) * .5 - .2; c.awayTy = .35 + r() * .35; }
          else if (r() < .55) { c.awayTx = 0; c.awayTy = 0; }
          else { c.awayTx = (r() * 2 - 1) * .8; c.awayTy = (r() * 2 - 1) * .5; }
        });
      } else {
        mode = 'contact';
        modeUntil = now + 3000 + r() * 2600;
      }
    }

    // reads first (avoid layout thrash)
    var faces = chars.map(function (c) { return center(c.face); });
    chars.forEach(function (c) {
      c.eyes.forEach(function (e) { var a = center(e.anchor); e.cx = a[0]; e.cy = a[1]; });
    });

    chars.forEach(function (c, ci) {
      var other = faces[1 - ci];
      c.eyes.forEach(function (e) {
        if (pointerActive) look(e, px, py, sat);
        else if (mode === 'contact') look(e, other[0], other[1], sat);
        else { e.tx = c.awayTx; e.ty = c.awayTy; }
      });
    });

    // writes
    chars.forEach(function (c) {
      var sumX = 0, sumY = 0;

      // contact amount drives blush, smile and pupil size
      var ct = (!pointerActive && mode === 'contact') ? 1 : 0;
      c.contact += (ct - c.contact) * Math.min(1, dt * (ct ? 1.5 : 4));
      c.pulse = Math.max(0, c.pulse - dt * 1.1);

      // blink
      var s = 1;
      if (c.blinkStart < 0 && now > c.nextBlink) c.blinkStart = now;
      if (c.blinkStart >= 0) {
        var p = (now - c.blinkStart) / 190;
        if (p >= 1) {
          c.blinkStart = -1;
          if (!c.dbl && r() < .16) { c.dbl = true; c.nextBlink = now + 120; }
          else { c.dbl = false; c.nextBlink = now + 2400 + r() * 3800; }
        } else {
          var w = p < .38 ? p / .38 : (1 - p) / .62;
          w = w * w * (3 - 2 * w);
          s = 1 - .93 * w;
        }
      }
      var wv = c.eyes.map(function (e) {
        if (e.wink < 0) return 0;
        var pw = (now - e.wink) / 460;
        if (pw >= 1) { e.wink = -1; return 0; }
        var ww = pw < .22 ? pw / .22 : pw < .62 ? 1 : (1 - pw) / .38;
        return ww * ww * (3 - 2 * ww);
      });

      c.eyes.forEach(function (e, i) {
        // spring toward target
        var k = 240, damp = 23;
        e.vx += ((e.tx * MX - e.x) * k - e.vx * damp) * dt;
        e.vy += ((e.ty * MY - e.y) * k - e.vy * damp) * dt;
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.x = Math.max(-MX * 1.08, Math.min(MX * 1.08, e.x));
        e.y = Math.max(-MY * 1.1, Math.min(MY * 1.1, e.y));
        var nx = e.x / MX, ny = e.y / MY;
        sumX += nx; sumY += ny;

        // pupil: breathes with distance, widens on eye contact, pinches on click
        var f = Math.min(1, Math.hypot(e.tx, e.ty));
        var pt = 1.06 - .12 * f + .1 * c.contact;
        if (now < pressUntil) pt *= .82;
        e.ps += (pt - e.ps) * Math.min(1, dt * 9);
        e.pupil.setAttribute('rx', f2(38 * e.ps));
        e.pupil.setAttribute('ry', f2(43 * e.ps));

        // left eyes are mirrored, so flip x in their local space
        var lx = e.m * e.x;
        var sx = 1 - .09 * Math.abs(nx);
        var pos = 'translate(' + f2(IX + lx) + ' ' + f2(IY + e.y) + ')';
        e.iris.setAttribute('transform', pos + ' scale(' + sx.toFixed(3) + ' 1)');
        e.core.setAttribute('transform', 'translate(' + f2(e.m * nx * 6) + ' ' + f2(ny * 5) + ')');
        e.hi.setAttribute('transform', pos + ' scale(' + e.m + ' 1)');
        e.hiIn.setAttribute('transform', 'translate(' + f2(-e.x * .32) + ' ' + f2(-e.y * .32) + ')');
        e.brow.setAttribute('transform', 'translate(' + f2(e.m * nx * 8) + ' ' + f2(ny * 16 + 12 * e.winkAmt) + ') rotate(' + f2(e.m * nx * 1.4) + ' 300 0)');

        // blink + wink (the other eye squints a touch during a wink)
        var se = Math.min(s, 1 - .96 * wv[i], 1 - .14 * wv[1 - i]);
        e.winkAmt = wv[i];
        e.closed.setAttribute('opacity', f2(Math.max(0, Math.min(1, (1 - se - .55) * 2.6))));
        if (se >= .999) e.blink.removeAttribute('transform');
        else e.blink.setAttribute('transform', 'translate(0 ' + PIV + ') scale(1 ' + se.toFixed(3) + ') translate(0 ' + (-PIV) + ')');
      });

      // blush and smile
      var bl = c.cfg.b0 + (c.cfg.b1 - c.cfg.b0) * Math.min(1, c.contact * 1.1) + .4 * c.pulse;
      c.blush.setAttribute('opacity', f2(Math.min(1.2, bl)));
      var sm = Math.max(c.contact * c.contact, c.pulse);
      c.mouthB.setAttribute('opacity', f2(sm * c.cfg.smile));
      c.mouthA.setAttribute('opacity', f2(1 - sm * c.cfg.smile));

      // head, hair and body motion
      if (!reduce) {
        var ax = sumX / 2, ay = sumY / 2;
        var br = Math.sin(now / 1000 * 1.7 + c.phase) * 1.5;
        var kh = Math.min(1, dt * 6), kb = Math.min(1, dt * 3);
        c.hx += (ax * 9 - c.hx) * kh; c.hy += (ay * 6 - c.hy) * kh; c.rot += (ax * 2.4 - c.rot) * kh;
        c.bx += (c.hx - c.bx) * kb; c.by += (c.hy - c.by) * kb; c.brot += (c.rot - c.brot) * kb;
        c.head.setAttribute('transform', 'translate(' + f2(c.hx) + ' ' + f2(c.hy + br) + ') rotate(' + f2(c.rot) + ' 0 190)');
        c.hairBack.setAttribute('transform', 'translate(' + f2(c.bx * .6) + ' ' + f2(c.by * .6 + br) + ') rotate(' + f2(c.brot * .6) + ' 0 190)');
        c.body.setAttribute('transform', 'translate(0 ' + f2(br * .5) + ')');
        var ang = Math.sin(now / 620 + c.phase) * 3 + (c.hx - c.bx) * .5;
        c.ahoge.setAttribute('transform', 'rotate(' + f2(ang) + ' ' + c.cfg.ahoge + ')');
      }
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
